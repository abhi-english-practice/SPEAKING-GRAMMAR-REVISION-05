 em có một chuyến đi do trường tổ chức đến một khu cắm trại gần Đà Lạt."}, {"id": "r5-s02", "en": "The weather was cool and sunny.", "chunks": ["The weather", "was cool and sunny."], "start": 4.93, "end": 6.66, "vi": "Thời tiết mát mẻ và có nắng."}, {"id": "r5-s03", "en": "In the morning, we planted trees and played badminton.", "chunks": ["In the morning,", "we planted trees", "and played badminton."], "start": 7.01, "end": 9.73, "vi": "Vào buổi sáng, chúng em trồng cây và chơi cầu lông."}, {"id": "r5-s04", "en": "Then we cooked lunch together.", "chunks": ["Then", "we cooked lunch together."], "start": 10.05, "end": 11.27, "vi": "Sau đó, chúng em cùng nhau nấu bữa trưa."}, {"id": "r5-s05", "en": "We had rice, chicken and vegetables.", "chunks": ["We had rice,", "chicken and vegetables."], "start": 11.5, "end": 13.59, "vi": "Chúng em ăn cơm, thịt gà và rau."}, {"id": "r5-s06", "en": "In the evening, we sang songs and danced around the campfire.", "chunks": ["In the evening,", "we sang songs", "and danced around the campfire."], "start": 13.98, "end": 17.03, "vi": "Vào buổi tối, chúng em hát và nhảy múa quanh đống lửa trại."}, {"id": "r5-s07", "en": "I was tired, but I felt happy.", "chunks": ["I was tired,", "but I felt happy."], "start": 17.46, "end": 19.58, "vi": "Em mệt nhưng em cảm thấy vui."}, {"id": "r5-s08", "en": "We all enjoyed the trip very much.", "chunks": ["We all enjoyed the trip", "very much."], "start": 19.86, "end": 21.74, "vi": "Tất cả chúng em đều rất thích chuyến đi."}], "vocabulary": [{"id": "r5-v1", "en": "went on a school trip", "meaning": "visited a place with our school", "kind": "Verb phrase", "occurrences": [{"sentence": 0, "start": 24, "end": 45}], "meaningVi": "đã có một chuyến đi do trường tổ chức"}, {"id": "r5-v2", "en": "campsite", "meaning": "a place where people stay in tents", "kind": "Word", "occurrences": [{"sentence": 0, "start": 51, "end": 59}], "meaningVi": "khu cắm trại"}, {"id": "r5-v3", "en": "planted trees", "meaning": "p function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function shuffledChunks(cs){let a=shuffle(cs.map((text,id)=>({text,id})));if(a.every((x,i)=>x.id===i))a.push(a.shift());return a}
let player=new Audio(),audioTicket=0,audioLesson=-1,sliceEnd=null,follow=false,frame=0,activeSentence=-1,speed=1;
player.preload='metadata';player.id='source-audio';player.hidden=true;document.body.append(player);
function stamp(t){t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
function stopAudio(){audioTicket++;player.pause();sliceEnd=null;try{player.currentTime=0}catch(e){}cancelAnimationFrame(frame);activeSentence=-1;document.querySelectorAll('.sentence.active').forEach(e=>e.classList.remove('active'));updateAudioUI()}
async function prepareAudio(ticket){let d=current();if(!d.audioAvailable)return false;if(audioLesson!==lesson){player.pause();audioLesson=lesson;player.src=d.audio;player.load()}if(player.readyState<1)await new Promise((ok,no)=>{player.addEventListener('loadedmetadata',ok,{once:true});player.addEventListener('error',no,{once:true})});return ticket===audioTicket}
async function playSource(si=null){if(!current().audioAvailable)return;let ticket=++audioTicket;player.pause();cancelAnimationFrame(frame);try{if(!await prepareAudio(ticket))return;let s=si===null?null:current().sentences[si];sliceEnd=s?s.end:null;if(s)player.currentTime=s.start;else if(player.ended)player.currentTime=0;player.playbackRate=speed;if(ticket!==audioTicket)return;await player.play();if(ticket===audioTicket)tick()}catch(e){if(ticket===audioTicket&&e.name!=='AbortError'){document.querySelectorAll('[data-audio-status]').forEach(x=>x.textContent='Audio could not be played. Keep the MP3 files beside index.html.')}}}
function pauseAudio(){audioTicket++;player.pause();cancelAnimationFrame(frame);updateAudioUI()}
async function resumeAudio(){if(audioLesson!==lesson)return playSource();if(sliceEnd!==null&&player.currentTime>=sliceEnd)return;const ticket=++audioTicket;try{await player.play();if(ticket===audioTicket)tick()}catch(e){}}
function tick(){updateAudioUI();if(sliceEnd!==null&&player.currentTime>=sliceEnd){player.pause();sliceEnd=null;updateAudioUI();return}if(!player.paused&&!player.ended)frame=requestAnimationFrame(tick)}
function updateAudioUI(){if(typeof DATA==='undefined')return;let d=current(),same=audioLesson===lesson,time=same?player.currentTime:0;document.querySelectorAll('[data-clock]').forEach(e=>e.textContent=stamp(time)+' / '+stamp(d.duration));document.querySelectorAll('[data-seek]').forEach(e=>{e.value=time});document.querySelectorAll('[data-playfull]').forEach(e=>e.textContent=same&&!player.paused?'▶ Playing':'▶ Play story');let idx=follow&&same&&!player.ended?d.sentences.findIndex(s=>Number.isFinite(s.start)&&time>=s.start&&time<s.end):-1;if(idx!==activeSentence){activeSentence=idx;document.querySelectorAll('.sentence.active').forEach(e=>e.classList.remove('active'));if(idx>=0){let el=document.getElementById(d.sentences[idx].id);el?.classList.add('active');if(el&&!player.paused){let r=el.getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}}}}
player.addEventListener('ended',()=>{sliceEnd=null;activeSentence=-1;document.querySelectorAll('.sentence.active').forEach(e=>e.classList.remove('active'));updateAudioUI()});player.addEventListener('timeupdate',updateAudioUI);player.addEventListener('pause',updateAudioUI);
function audioControls(){if(!current().audioAvailable)return '<p class="note">Audio for this reading is coming soon.</p>';return `<div class="audio-controls"><div class="audio-buttons"><button data-playfull>▶ Play story</button><button data-pause>Pause</button><button data-resume>Resume</button><button data-stop>Stop</button></div><div class="seek-row"><input type="range" data-seek min="0" max="${current().duration}" step="0.01" value="0" aria-label="Seek story audio"><span data-clock>${stamp(0)} / ${stamp(current().duration)}</span></div><div class="audio-buttons"><select data-speed aria-label="Playback speed">${[.75,.85,1,1.15,1.3].map(v=>`<option ${v===speed?'selected':''} value="${v}">${v}×</option>`).join('')}</select><button data-follow aria-pressed="${follow}" class="${follow?'on':''}">Read-along ${follow?'ON':'OFF'}</button></div><div class="note" data-audio-status role="status"></div></div>`}
function sentenceButton(si){return current().audioAvailable?`<button data-listen="${si}">▶ Listen to sentence</button>`:'<button disabled>▶ Listen to sentence</button>'}
function bindAudio(){document.querySelectorAll('[data-playfull]').forEach(b=>b.onclick=()=>playSource());document.querySelectorAll('[data-pause]').forEach(b=>b.onclick=pauseAudio);document.querySelectorAll('[data-resume]').forEach(b=>b.onclick=resumeAudio);document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=stopAudio);document.querySelectorAll('[data-listen]').forEach(b=>b.onclick=()=>playSource(+b.dataset.listen));document.querySelectorAll('[data-seek]').forEach(b=>b.oninput=async()=>{let ticket=++audioTicket,wasPlaying=audioLesson===lesson&&!player.paused;player.pause();if(await prepareAudio(ticket)){sliceEnd=null;player.currentTime=+b.value;updateAudioUI();if(wasPlaying)resumeAudio()}});document.querySelectorAll('[data-speed]').forEach(b=>b.onchange=()=>{speed=+b.value;player.playbackRate=speed});document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=()=>{follow=!follow;render()});updateAudioUI()}
function closePopup(restore=false){$('#popup').hidden=true;if(restore&&lastTrigger?.isConnected)lastTrigger.focus()}
function chooseLesson(i){stopAudio();closePopup();models.clear();stage=1;lesson=i;sent=0;showAnswer=false;cardFlip=false;cardIndex=0;cardOrder=[];resetChunks();render()}
function chooseMode(m){stopAudio();closePopup();mode=m;models.clear();showAnswer=false;cardFlip=false;resetChunks();render()}
function resetChunks(){chosen=[];pool=shuffledChunks(current().sentences[sent].chunks)}
function highlighted(si){let s=current().sentences[si].en;let spans=[];current().vocabulary.forEach((v,vi)=>v.occurrences.filter(o=>o.sentence===si).forEach(o=>spans.push({...o,vi})));spans.sort((a,b)=>a.start-b.start);let result='',end=0;for(let o of spans){if(o.start<end)continue;result+=esc(s.slice(end,o.start))+`<button class="term ${o.vi%2?'mint':''}" data-v="${o.vi}" data-s="${si}" aria-label="Study ${esc(s.slice(o.start,o.end))}">${esc(s.slice(o.start,o.end))}</button>`;end=o.end}return result+esc(s.slice(end))}
function heading(){return intro()+`<div class="eyebrow">READING 0${lesson+1} · ${esc(current().units)}</div><h2>${esc(current().title)}</h2>`}
function audioNotice(){return audioControls()}
function home(){return heading()+`<div class="tools"><button id="highlightBtn" ${follow?'disabled':''} class="${highlights?'on':''}" aria-pressed="${highlights}">Highlights ${highlights?'ON':'OFF'}</button></div><div class="passage ${highlights?'':'highlights-off'}"><img class="art" src="${current().image}" alt="${['Mai outside her home with swimming goggles and a schoolbag','Two friends cycling in a park with helmets','A girl helping a friend learn at school','A classroom with maps, school supplies and a bag','Children at a campsite with tents and a campfire'][lesson]}">${current().sentences.map((s,i)=>`<span class="sentence" id="${s.id}">${highlighted(i)}</span>`).join(' ')}</div>`+(vn?`<section class="panel translation-block" lang="vi"><h3>Nghĩa tiếng Việt</h3>${current().sentences.map(s=>`<p>${esc(s.vi)}</p>`).join('')}</section>`:'')+audioNotice()+`<section class="panel"><h3>Words to take with you</h3><div class="vocab">${current().vocabulary.map((v,i)=>`<button data-v="${i}" data-s="${v.occurrences[0].sentence}">${esc(v.en)}</button>`).join('')}</div><p class="note">Tap an expression to see its meaning and one sentence from the story.</p></section><section class="panel"><h3>Grammar in focus</h3><div class="grammar">${current().grammar.map(([g,e])=>`<div><b>${esc(g)}</b><p>${esc(e)}</p></div>`).join('')}</div></section>`}
function sentenceView(){let d=current();let done=d.sentences.filter((s,i)=>built.has(keyFor(i))).length;
return heading()+`<span class="practice-counter">${done} / ${d.sentences.length} sentences built</span><div class="stage-nav" aria-label="Practice stages">${[[1,'Build & Say'],[2,'Read & Answer'],[3,'Speak on Your Own']].map(([n,name])=>`<button data-stage="${n}" class="${stage===n?'active':''}" aria-pressed="${stage===n}"><small>STAGE 0${n}</small>${name}</button>`).join('')}</div><div class="practice-grid"><section class="scene-column"><div class="scene-frame"><img src="${d.image}" alt="Illustration for ${esc(d.title)}"><button class="enlarge" id="enlarge">⤢ Enlarge picture</button></div><p class="scene-caption">${['Meet Mai and learn about her home.','Meet Ben and his friend in Hanoi.','Think about school and your dream job.','Explore a school and its classroom.','Remember a school trip near Da Lat.'][lesson]}</p><div class="scene-help">${stage===1?'Tap chunks to build an answer. Check it, then say the whole sentence.':stage===2?'Use the story to answer each question. Try first, then reveal the model answer.':'Talk about your own life. Make your answers true for you.'}</div><p class="speaker-note">${stage<3?'The answers use the words of the story. You can read the full story in Reading.':'Say two or three sentences for each prompt. You can write a few notes if you need them.'}</p>${audioControls()}</section><section aria-label="Practice questions">${stage===1?d.sentences.map((s,i)=>{let st=builder(i);return `<article class="question-card"><h3><span class="q-number">${String(i+1).padStart(2,'0')}</span>${esc(QUESTIONS[lesson][i])}</h3><div class="blank" aria-label="Your answer ${i+1}">${st.chosen.map(id=>`<button data-remove="${i}:${id}">${esc(s.chunks[id])}</button>`).join('')||'<span class="note">Tap the chunks to build your answer.</span>'}</div><div class="chunks" aria-label="Available chunks ${i+1}">${st.pool.map(c=>`<button data-add="${i}:${c.id}" ${st.chosen.includes(c.id)?'disabled class="used"':''}>${esc(c.text)}</button>`).join('')}</div><div class="mini-actions"><button data-undo="${i}">Undo</button><button data-rebuild="${i}">Clear & shuffle</button></div><button class="primary" data-check="${i}">Check answer</button> ${sentenceButton(i)}<div class="feedback ${st.ok?'':'wrong'}" role="status">${st.feedback}${st.feedback&&st.ok?(vn?`<p class="vi-text" lang="vi">${esc(s.vi)}</p>`:`<button class="local-vi" data-enable-vn>Show Vietnamese</button>`):''}</div></article>`}).join(''):stage===2?d.sentences.map((s,i)=>`<article class="question-card"><h3><span class="q-number">${String(i+1).padStart(2,'0')}</span>${esc(QUESTIONS[lesson][i])}</h3><p class="note">Answer aloud before you check.</p><button data-model="${i}">${models.has(keyFor(i))?'Hide':'Show'} model answer</button>${models.has(keyFor(i))?`<div class="model-answer">${sentenceButton(i)}<br>${highlighted(i)}${vn?`<p class="vi-text" lang="vi">${esc(s.vi)}</p>`:''}</div><p class="note">${esc(EXPLANATIONS[lesson][i])}</p>`:''}</article>`).join(''):PERSONAL[lesson].map((q,i)=>`<article class="question-card"><h3><span class="q-number">${String(i+1).padStart(2,'0')}</span>${esc(q)}</h3><textarea class="response" data-draft="${i}" placeholder="Optional notes — your own ideas" aria-label="Notes for prompt ${i+1}">${esc(drafts[keyFor(i)]||'')}</textarea><button data-practised="${i}" class="${practised.has(keyFor(i))?'status-known':''}">${practised.has(keyFor(i))?'✓ Practised':'I have practised this'}</button></article>`).join('')}</section></div><div class="navline"><button id="previousReading" ${lesson===0?'disabled':''}>← Previous reading</button><button id="nextStage" class="primary">${stage<3?'Next stage →':lesson<4?'Next reading →':'Back to Reading'}</button></div>`}
function bindPractice(){
 document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stopAudio();closePopup();stage=+b.dataset.stage;models.clear();render()});
 document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let[i,id]=b.dataset.add.split(':').map(Number);builder(i).chosen.push(id);builder(i).feedback='';render()});
 document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let[i,id]=b.dataset.remove.split(':').map(Number);builder(i).chosen=builder(i).chosen.filter(x=>x!==id);builder(i).feedback='';render()});
 document.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{let st=builder(+b.dataset.undo);st.chosen.pop();st.feedback='';render()});
 document.querySelectorAll('[data-rebuild]').forEach(b=>b.onclick=()=>{delete builders[keyFor(+b.dataset.rebuild)];render()});
 document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let i=+b.dataset.check,st=builder(i);st.ok=st.chosen.length===current().sentences[i].chunks.length&&st.chosen.every((x,j)=>x===j);st.feedback=st.ok?'✓ Correct. Now say the whole sentence.<b>'+esc(current().sentences[i].en)+'</b>'+esc(EXPLANATIONS[lesson][i]):'Try again. Check the order and include every chunk.';if(st.ok)built.add(keyFor(i));render()});
 document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{let k=keyFor(+b.dataset.model);models.has(k)?models.delete(k):models.add(k);render()});
 document.querySelectorAll('[data-draft]').forEach(t=>t.oninput=()=>drafts[keyFor(+t.dataset.draft)]=t.value);
 document.querySelectorAll('[data-practised]').forEach(b=>b.onclick=()=>{let k=keyFor(+b.dataset.practised);practised.has(k)?practised.delete(k):practised.add(k);render()});
 action('previousReading',()=>{stage=1;chooseLesson(lesson-1)});action('nextStage',()=>{if(stage<3){stage++;models.clear();render()}else if(lesson<4){stage=1;chooseLesson(lesson+1)}else chooseMode('Home')});
 action('enlarge',()=>{let box=document.createElement('div');box.className='image-dialog';box.setAttribute('role','dialog');box.setAttribute('aria-label','Enlarged picture');box.innerHTML='<button aria-label="Close enlarged picture">× Close</button><img src="'+current().image+'" alt="'+esc(current().title)+'">';box.onclick=e=>{if(e.target===box||e.target.tagName==='BUTTON')box.remove()};document.body.append(box);box.querySelector('button').focus()});
}
function cardList(){let all=current().vocabulary.map((v,i)=>i).filter(i=>filter==='all'||(statuses[current().vocabulary[i].id]||'new')===filter);if(!cardOrder.length||cardOrder.some(i=>!all.includes(i))||all.some(i=>!cardOrder.includes(i)))cardOrder=all;return cardOrder}
function cards(){let list=cardList();cardIndex=Math.min(cardIndex,Math.max(0,list.length-1));let vi=list[cardIndex],v=current().vocabulary[vi];return heading()+`<div class="modebar"><h3>Review Cards</h3><select class="card-filter" id="filter" aria-label="Filter cards">${[['all','All words'],['new','New'],['study','Study'],['known','Known']].map(([a,b])=>`<option value="${a}" ${filter===a?'selected':''}>${b}</option>`).join('')}</select></div><p class="note">Your word choices are kept for this session.</p>`+(v?`<section class="panel"><div class="navline"><button id="prevCard" ${cardIndex===0?'disabled':''}>← Back</button><span class="count">Card ${cardIndex+1} / ${list.length} · ${statuses[v.id]||'new'}</span><button id="nextCard" ${cardIndex===list.length-1?'disabled':''}>Next →</button></div><div class="card-front">${esc(v.en)}</div><div class="split"><button id="flip">${cardFlip?'Hide meaning':'Reveal meaning'}</button><button id="shuffleCards">Shuffle</button></div>${cardFlip?`<div class="card-back"><div class="eyebrow">${esc(v.kind)}</div><b>${esc(v.meaning)}</b>${vn?`<p class="vi-text" lang="vi">${esc(v.meaningVi)}</p>`:''}<p>${esc(current().sentences[v.occurrences[0].sentence].en)}</p>${vn?`<p class="vi-text" lang="vi">${esc(current().sentences[v.occurrences[0].sentence].vi)}</p>`:''}${sentenceButton(v.occurrences[0].sentence)}<button id="goSentence">Go to sentence →</button></div>`:''}<div class="split tools"><button id="knownCard" class="status-known">I know this</button><button id="studyCard" class="status-study">Study</button></div></section>`:'<div class="panel empty">No cards in this group yet.</div>')+`<div class="tools"><button id="resetCards">Reset this reading’s cards</button></div>`}
function studio(){return heading()+`<h3>Audio Studio</h3><p class="note">Create one complete recording for this reading. Read the English text naturally and clearly, with a short pause between sentences. Keep every word unchanged. Do not read the title or filename.</p><section class="panel"><div class="eyebrow">Target filename · ${current().audio}</div><p><button id="copyFull">Copy full text</button></p><textarea id="fullText" readonly aria-label="Full recording script">${esc(current().text)}</textarea></section><section class="panel"><h3>Short sections</h3>${Array.from({length:Math.ceil(current().sentences.length/2)},(_,i)=>{let part=current().sentences.slice(i*2,i*2+2).map(s=>s.en).join(' ');return `<details class="studio-part"><summary>Section ${i+1}</summary><p>${esc(part)}</p><button data-copy="${i}">Copy section</button></details>`}).join('')}</section><div class="note" id="copyStatus" role="status"></div>`}
function render(){activeSentence=-1;document.body.classList.toggle('readalong-on',follow);let d=current();$('#vnToggle').textContent='VN · '+(vn?'ON':'OFF');$('#vnToggle').classList.toggle('on',vn);$('#vnToggle').setAttribute('aria-pressed',String(vn));$('#tabs').innerHTML=['Home','Sentence','Review Cards','Audio Studio'].map(m=>`<button data-mode="${m}" class="${mode===m?'active':''}" aria-pressed="${mode===m}">${m==='Home'?'Reading':m==='Sentence'?'Practice':m}</button>`).join('');$('#lessons').innerHTML=DATA.map((x,i)=>`<button data-lesson="${i}" class="${lesson===i?'active':''}"><img src="${x.image}" alt=""><span><small>P0${i+1} · ${esc(x.units)}</small>${esc(x.title)}</span></button>`).join('');$('#lessonSelect').innerHTML=DATA.map((x,i)=>`<option value="${i}" ${lesson===i?'selected':''}>0${i+1} · ${esc(x.title)}</option>`).join('');$('#progress').innerHTML=allProgress();$('#main').innerHTML=mode==='Home'?home():mode==='Sentence'?sentenceView():mode==='Review Cards'?cards():studio();bind()}
async function copy(text,button){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{let t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();if(!document.execCommand('copy'))throw Error('copy');t.remove()}button.textContent='Copied';$('#copyStatus').textContent='Text copied.'}catch(e){$('#copyStatus').textContent='Copy is unavailable here. Select the script and copy it manually.'}}
function mark(vi,status){statuses[current().vocabulary[vi].id]=status;if(mode==='Review Cards'){cardFlip=false;render()}}
function pop(vi,si,trigger){lastTrigger=trigger;const v=current().vocabulary[vi],s=current().sentences[si].en,o=v.occurrences.find(o=>o.sentence===si);if(!o)return;let source=esc(s.slice(0,o.start))+'<strong>'+esc(s.slice(o.start,o.end))+'</strong>'+esc(s.slice(o.end));let p=$('#popup');p.innerHTML=`<div class="pop-head">${sentenceButton(si)}<button id="closePop" aria-label="Close vocabulary">×</button></div><h3>${esc(v.en)}</h3><div class="eyebrow">${esc(v.kind)}</div><p class="definition">${esc(v.meaning)}</p>${vn?`<p class="vi-text" lang="vi">${esc(v.meaningVi)}</p>`:''}<div class="source">${source}${vn?`<p class="vi-text" lang="vi">${esc(current().sentences[si].vi)}</p>`:''}</div><div class="split"><button class="status-known" id="known">I know this</button><button class="status-study" id="study">Study</button></div><p class="count" id="wordStatus">${statuses[v.id]||'New word'}</p>`;p.hidden=false;let vw=document.documentElement.clientWidth,vh=document.documentElement.clientHeight;p.style.maxWidth=(vw-24)+'px';let r=trigger.getBoundingClientRect(),w=p.offsetWidth,h=p.offsetHeight;p.style.left=Math.max(12,Math.min(r.left,vw-w-12))+'px';p.style.top=Math.max(12,Math.min(r.bottom+8,vh-h-12))+'px';$('#closePop').onclick=()=>closePopup(true);$('#known').onclick=()=>{mark(vi,'known');$('#wordStatus').textContent='Known'};$('#study').onclick=()=>{mark(vi,'study');$('#wordStatus').textContent='Study'};$('#closePop').focus();bindAudio()}
function action(id,f){let e=$('#'+id);if(e)e.onclick=f}
function bind(){bindPractice();bindAudio();action('vnToggle',()=>{vn=!vn;closePopup();render()});document.querySelectorAll('[data-enable-vn]').forEach(b=>b.onclick=()=>{vn=true;render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>chooseMode(b.dataset.mode));document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>chooseLesson(+b.dataset.lesson));$('#lessonSelect').onchange=e=>chooseLesson(+e.target.value);document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>pop(+b.dataset.v,+b.dataset.s,b));action('highlightBtn',()=>{highlights=!highlights;render()});document.querySelectorAll('[data-chunk]').forEach(b=>b.onclick=()=>{chosen.push(+b.dataset.chunk);render()});document.querySelectorAll('[data-return]').forEach(b=>b.onclick=()=>{chosen=chosen.filter(x=>x!==+b.dataset.return);render()});action('clear',()=>{chosen=[];showAnswer=false;render()});action('reshuffle',()=>{showAnswer=false;resetChunks();render()});action('answer',()=>{showAnswer=!showAnswer;render()});action('hint',()=>{$('#feedback').textContent='Start with: '+current().sentences[sent].chunks[0]});action('check',()=>{let ok=chosen.length===current().sentences[sent].chunks.length&&chosen.every((x,i)=>x===i);$('#feedback').textContent=ok?'Well done! Your sentence matches the story.':'Try again. Check the order and include every chunk.'});for(let [id,n] of [['prevSentence',-1],['nextSentence',1]])action(id,()=>{stopAudio();sent+=n;showAnswer=false;resetChunks();render()});let f=$('#filter');if(f)f.onchange=e=>{filter=e.target.value;cardIndex=0;cardFlip=false;cardOrder=[];render()};action('flip',()=>{cardFlip=!cardFlip;render()});for(let [id,n] of [['prevCard',-1],['nextCard',1]])action(id,()=>{stopAudio();cardIndex+=n;cardFlip=false;render()});action('shuffleCards',()=>{cardOrder=shuffle(cardList());cardIndex=0;cardFlip=false;render()});action('knownCard',()=>mark(cardList()[cardIndex],'known'));action('studyCard',()=>mark(cardList()[cardIndex],'study'));action('goSentence',()=>{let id=current().sentences[current().vocabulary[cardList()[cardIndex]].occurrences[0].sentence].id;chooseMode('Home');document.getElementById(id)?.scrollIntoView({block:'center',behavior:'smooth'})});action('resetCards',()=>{for(let v of current().vocabulary)delete statuses[v.id];cardOrder=[];cardIndex=0;cardFlip=false;render()});action('copyFull',()=>copy(current().text,$('#copyFull')));document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(current().sentences.slice(+b.dataset.copy*2,+b.dataset.copy*2+2).map(s=>s.en).join(' '),b))}
document.addEventListener('pointerdown',e=>{if(!$('#popup').hidden&&!$('#popup').contains(e.target)&&!e.target.closest('[data-v]'))closePopup()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePopup(true);document.querySelector('.image-dialog')?.remove()}});window.addEventListener('resize',()=>closePopup());resetChunks();render();
</script></body></html>
